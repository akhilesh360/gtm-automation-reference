[tool.ruff]
line-length = 130
target-version = "py311"
exclude = [".venv", "data", "logs", "sfdx", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP007"]

[tool.ruff.lint.isort]
known-first-party = ["src", "api", "dashboard", "scripts", "erp", "tests"]
