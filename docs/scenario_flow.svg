<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <style>
      .box{rx:12;ry:12;stroke-width:1.5}
      .n{font-size:15px;font-weight:700;fill:#fff}
      .t{font-size:15px;font-weight:700;fill:#111}
      .s{font-size:12.5px;fill:#333}
      .r{font-size:12.5px;font-weight:700}
      .ar{stroke:#444;stroke-width:2;fill:none;marker-end:url(#a)}
      .foot{font-size:12px;fill:#666;font-style:italic}
    </style>
  </defs>
  <rect width="1200" height="330" fill="#fff"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="800" fill="#111">Reference scenarios: what happens, step by step</text>

  <!-- 1 -->
  <rect x="30" y="60" width="255" height="200" class="box" fill="#f0fdf4" stroke="#1a9a5a"/>
  <circle cx="56" cy="84" r="13" fill="#1a9a5a"/><text x="51" y="89" class="n">1</text>
  <text x="76" y="89" class="t">Acme AI</text>
  <text x="46" y="114" class="s">Starter plan, $5,000/mo × 12</text>
  <text x="46" y="132" class="s">5% discount, Net 30</text>
  <text x="46" y="158" class="s">→ policy check: nothing to flag</text>
  <text x="46" y="182" class="r" fill="#1a9a5a">Auto-Approved</text>
  <text x="46" y="202" class="s">→ 1 audit row (standard policy)</text>
  <text x="46" y="222" class="s">→ sales order to ERP, Reconciled</text>

  <!-- 2 -->
  <rect x="325" y="60" width="255" height="200" class="box" fill="#fff7ed" stroke="#e07b00"/>
  <circle cx="351" cy="84" r="13" fill="#e07b00"/><text x="346" y="89" class="n">2</text>
  <text x="371" y="89" class="t">Globex Enterprise</text>
  <text x="341" y="114" class="s">Enterprise plan, $50,000/mo × 12</text>
  <text x="341" y="132" class="s">25% discount, Net 60, custom overage</text>
  <text x="341" y="158" class="s">→ 4 rules fire, ACV $450,000</text>
  <text x="341" y="182" class="r" fill="#e07b00">Pending Approval</text>
  <text x="341" y="202" class="s">→ route: RevOps, Finance, VP Sales</text>
  <text x="341" y="222" class="s">→ 5 audit rows, approvers emailed</text>

  <!-- 3 -->
  <rect x="620" y="60" width="255" height="200" class="box" fill="#eff6ff" stroke="#2f6fd6"/>
  <circle cx="646" cy="84" r="13" fill="#2f6fd6"/><text x="641" y="89" class="n">3</text>
  <text x="666" y="89" class="t">Initech ML</text>
  <text x="636" y="114" class="s">Clay: 2 open ML roles</text>
  <text x="636" y="132" class="s">HubSpot: meeting + emails · usage +40%</text>
  <text x="636" y="158" class="s">→ score 87.0 = Tier 1</text>
  <text x="636" y="182" class="r" fill="#2f6fd6">Salesforce Task created</text>
  <text x="636" y="202" class="s">→ by Flow B, deduped on re-run</text>
  <text x="636" y="222" class="s">→ enrolled in exec outreach</text>

  <!-- 4 -->
  <rect x="915" y="60" width="255" height="200" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <circle cx="941" cy="84" r="13" fill="#7c3aed"/><text x="936" y="89" class="n">4</text>
  <text x="961" y="89" class="t">Globex, approved</text>
  <text x="931" y="114" class="s">Jane Doe clicks Approve in Salesforce</text>
  <text x="931" y="132" class="s">→ Flow A stamps approver + time</text>
  <text x="931" y="158" class="s">→ engine reads it back (audit row)</text>
  <text x="931" y="182" class="r" fill="#7c3aed">Sales order $450,000</text>
  <text x="931" y="202" class="s">→ 12 monthly billing lines</text>
  <text x="931" y="222" class="s">→ Reconciled on the quote</text>

  <path d="M285,160 L323,160" class="ar"/>
  <path d="M580,160 L618,160" class="ar"/>
  <path d="M875,160 L913,160" class="ar"/>

  <text x="600" y="296" text-anchor="middle" class="foot">All companies and people in these scenarios are fictional placeholders generated by the seeded data script.</text>
  <text x="600" y="314" text-anchor="middle" class="foot">Run them with: python -m src.main scenarios</text>
</svg>
