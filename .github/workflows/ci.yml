name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Generate seeded data
        run: python -m scripts.generate_mock_data
      - name: Test (offline mode, no credentials)
        run: pytest -q
      - name: Scenario run
        run: python -m src.main scenarios
